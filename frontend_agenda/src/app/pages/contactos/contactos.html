<div class="contacts-page">
  <div class="contacts-header">
    <h2 class="page-title">Lista de contactos</h2>
    <p class="page-subtitle">Administra todos tus contactos desde aquí</p>
  </div>

  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input
      class="search-input"
      type="text"
      placeholder="Buscar contacto..."
      (input)="busqueda.set($any($event.target).value)"
    > <!-- NOTA Event binding: Actualiza el signal de busqueda cada vez que el usuario escribe -->
  </div>

  <div class="contacts-list">
    @for (c of contactosFiltrados(); track c.id) {
      <app-contacto-card [contacto]="c" (onEdit)="editar($event)" (onDelete)="eliminar($event)"></app-contacto-card> <!-- NOTA Property binding: Pasa el contacto al componente, Event binding: Escucha eventos de editar y eliminar -->
    }
    @if (contactosFiltrados().length === 0) {
      <div class="empty-state">
        <span class="empty-state__icon">📭</span>
        <p class="empty-state__text">No se encontraron contactos</p>
      </div>
    }
  </div>
</div>
