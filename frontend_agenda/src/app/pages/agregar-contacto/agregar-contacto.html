<div class="form-page">
  <div class="form-page__header">
    <h2 class="page-title">Agregar contacto</h2>
    <p class="page-subtitle">Completa los datos del nuevo contacto</p>
  </div>
  <div class="form-card">
    <form (ngSubmit)="guardar()">
      <div class="form-group">
        <label class="form-label" for="nombre">👤 NOMBRE:</label>
        <input id="nombre" class="form-input" type="text" [(ngModel)]="contacto.nombre" name="nombre" placeholder="Ej: Juan García" required> <!-- NOTA Two-way binding: Sincroniza el valor del input con la propiedad nombre del objeto contacto -->
      </div>
      <div class="form-group">
        <label class="form-label" for="telefono">📞 TELÉFONO:</label>
        <input id="telefono" class="form-input" type="text" [(ngModel)]="contacto.telefono" name="telefono" placeholder="Ej: 4491234567" required> <!-- NOTA Two-way binding: Sincroniza el valor del input con la propiedad telefono del objeto contacto -->
      </div>
      <div class="form-group">
        <label class="form-label" for="email">✉️ EMAIL:</label>
        <input id="email" class="form-input" type="email" [(ngModel)]="contacto.email" name="email" placeholder="Ej: juan@gmail.com" required>
      </div>
      <button class="submit-btn" type="submit">💾 Guardar contacto</button>
    </form>
  </div>
</div>
