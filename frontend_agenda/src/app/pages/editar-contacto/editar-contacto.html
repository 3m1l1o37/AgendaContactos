<div class="form-page">
  <div class="form-page__header">
    <h2 class="page-title">Editar contacto</h2>
    <p class="page-subtitle">Actualiza los datos del contacto</p>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="guardar()">

      <div class="form-group">
        <label class="form-label" for="nombre">👤 NOMBRE:</label>
        <input id="nombre" class="form-input" type="text"
          formControlName="nombre"
          placeholder="Ej: Juan García">
      </div>

      <div class="form-group">
        <label class="form-label" for="telefono">📞 TELÉFONO:</label>
        <input id="telefono" class="form-input" type="text"
          formControlName="telefono"
          placeholder="Ej: 4491234567">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">✉️ EMAIL:</label>
        <input id="email" class="form-input" type="email"
          formControlName="email"
          placeholder="Ej: juan@gmail.com">
      </div>

      <button class="submit-btn" type="submit" [disabled]="form.invalid">
        ✅ Guardar cambios
      </button>

    </form>
  </div>
</div>
